<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Termoterapia</title>
  <link rel="stylesheet" href="css/estilo.css">
  <!-- dados.js: conteúdo de exemplo. comum.js: perfil, proteção de acesso e localStorage. login.js: tela de login -->
  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/login.js"></script>
</head>
<body>
  <div class="app">

    <main class="tela-escolha">
      <div class="img-x p170" role="img" aria-label="Logotipo do aplicativo"></div>
      <h1>Termoterapia</h1>
      <p>Seu cuidado na palma da mão</p>

      <form class="form-login" id="form-login" novalidate>
        <!-- Perfil: o mesmo login serve para os dois perfis -->
        <div class="alternancia" role="group" aria-label="Entrar como">
          <button type="button" data-perfil-login="paciente" aria-pressed="true">Paciente</button>
          <button type="button" data-perfil-login="fisioterapeuta" aria-pressed="false">Fisioterapeuta</button>
        </div>

        <div class="campo">
          <label class="rotulo" for="email">E-mail</label>
          <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" required>
        </div>

        <div class="campo">
          <label class="rotulo" for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required>
        </div>

        <p class="msg-erro" id="msg-erro" role="alert" hidden></p>

        <button class="btn grande" type="submit">Entrar</button>
      </form>

      <p class="nota">Protótipo: qualquer e-mail e senha funcionam.</p>
    </main>
  </div>
</body>
</html>
