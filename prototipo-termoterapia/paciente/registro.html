<!DOCTYPE html>
<html lang="pt-BR" data-perfil="paciente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Como me senti - Termoterapia</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <!-- dados.js: conteúdo de exemplo. comum.js: perfil, proteção de acesso e localStorage -->
  <script src="../js/dados.js"></script>
  <script src="../js/comum.js"></script>
</head>
<body>
  <div class="app">
    <header class="cabecalho">
      <a class="voltar" href="inicio.html" data-voltar>← Voltar</a>
      <h1 class="titulo-direita">Como me senti</h1>
    </header>
    <main class="conteudo">
      <p>Como está agora?</p>
      <div class="tres-botoes">
        <button class="btn" type="button" data-resposta="Melhor" aria-pressed="false">Melhor</button>
        <button class="btn" type="button" data-resposta="Igual" aria-pressed="false">Igual</button>
        <button class="btn" type="button" data-resposta="Pior" aria-pressed="false">Pior</button>
      </div>
      <div class="caixa lista lista-caixa">
        <label class="linha-check"><input type="checkbox" name="sintoma" value="Vermelhidão"> Vermelhidão</label>
        <label class="linha-check"><input type="checkbox" name="sintoma" value="Formigamento"> Formigamento</label>
        <label class="linha-check"><input type="checkbox" name="sintoma" value="Dor aumentou"> Dor aumentou</label>
        <label class="linha-check"><input type="checkbox" name="sintoma" value="Ardência"> Ardência</label>
      </div>
      <p id="msg" role="status"></p>
      <button class="btn" type="button" id="btn-salvar">Salvar registro</button>
      <div class="aviso" id="aviso-piora">
        Piorou? Procure avaliação.
        <a class="btn" href="contato.html" id="btn-contato" hidden>Fale com seu profissional</a>
      </div>
      <section aria-labelledby="t-registros">
        <h2 class="titulo" id="t-registros">Seus registros</h2>
        <p id="resumo" style="margin:8px 0 12px"></p>
        <div class="caixa lista-caixa"><ul class="lista" id="lista-registros"></ul></div>
      </section>
    </main>
    <nav class="menu" aria-label="Menu principal">
      <a href="inicio.html"><span class="bolinha" aria-hidden="true"></span>Início</a>
      <a href="tratamentos.html"><span class="bolinha" aria-hidden="true"></span>Tratamentos</a>
      <a href="registro.html" aria-current="page"><span class="bolinha" aria-hidden="true"></span>Evolução</a>
      <a href="perfil.html"><span class="bolinha" aria-hidden="true"></span>Perfil</a>
    </nav>
  </div>
  <script src="../js/registro.js"></script>
</body>
</html>
