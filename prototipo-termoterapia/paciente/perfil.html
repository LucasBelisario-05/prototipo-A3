<!DOCTYPE html>
<html lang="pt-BR" data-perfil="paciente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil - Termoterapia</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <!-- dados.js: conteúdo de exemplo. comum.js: perfil, proteção de acesso e localStorage -->
  <script src="../js/dados.js"></script>
  <script src="../js/comum.js"></script>
</head>
<body>
  <div class="app">
    <header class="cabecalho">
      <a class="voltar" href="inicio.html" data-voltar>← Voltar</a>
      <h1 class="titulo-direita">Perfil</h1>
    </header>
    <main class="conteudo">
      <div class="contato-topo">
        <div class="img-x p90" role="img" aria-label="Foto do perfil"></div>
        <p><strong>Maria Silva</strong><br>Paciente</p>
      </div>
      <a class="btn" href="../index.html" data-trocar-perfil>Trocar perfil</a>
      <button class="btn sec" type="button" id="btn-apagar">Apagar meus dados deste aparelho</button>
      <div class="aviso" id="confirmar-apagar" hidden>
        <p>Isso apaga seus registros e lembretes deste aparelho. Deseja continuar?</p>
        <button class="btn" type="button" id="btn-sim" style="margin-top:12px">Sim, apagar</button>
        <button class="btn sec" type="button" id="btn-cancelar" style="margin-top:12px">Cancelar</button>
      </div>
      <p id="msg-apagado" role="status" class="msg-ok"></p>
    </main>
    <nav class="menu" aria-label="Menu principal">
      <a href="inicio.html"><span class="bolinha" aria-hidden="true"></span>Início</a>
      <a href="tratamentos.html"><span class="bolinha" aria-hidden="true"></span>Tratamentos</a>
      <a href="registro.html"><span class="bolinha" aria-hidden="true"></span>Evolução</a>
      <a href="perfil.html" aria-current="page"><span class="bolinha" aria-hidden="true"></span>Perfil</a>
    </nav>
  </div>
  <script src="../js/paciente.js"></script>
</body>
</html>
