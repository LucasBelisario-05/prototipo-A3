<!DOCTYPE html>
<html lang="pt-BR" data-perfil="paciente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sua orientação - Termoterapia</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <!-- dados.js: conteúdo de exemplo. comum.js: perfil, proteção de acesso e localStorage -->
  <script src="../js/dados.js"></script>
  <script src="../js/comum.js"></script>
</head>
<body>
  <div class="app">
    <header class="cabecalho">
      <a class="voltar" href="inicio.html" data-voltar>← Voltar</a>
      <h1 class="titulo-direita">Sua orientação</h1>
    </header>
    <main class="conteudo">
      <!-- orientacao.js preenche tudo conforme ?recurso=frio ou calor -->
      <div id="conteudo" class="conteudo" style="padding:0;overflow:visible">
        <div class="linha-recurso">
          <div class="img-x p90" role="img" aria-label="Imagem da orientação"></div>
          <div>
            <p class="recurso-nome" id="recurso-nome"></p>
            <p class="recurso-local" id="recurso-local" hidden></p>
          </div>
        </div>
        <div class="caixa" id="tempo"></div>
        <div class="caixa lista-caixa"><ul class="lista" id="passos"></ul></div>
        <p class="aviso" id="cuidados"></p>
        <button class="btn" type="button" id="btn-lembrar">Lembrar-me</button>
        <div class="form-lembrete" id="form-lembrete" hidden>
          <label class="rotulo" for="hora">Horário do lembrete</label>
          <input type="time" id="hora">
          <button class="btn" type="button" id="btn-confirmar">Confirmar lembrete</button>
        </div>
        <p id="msg-lembrete" role="status"></p>
        <p class="centro">Liberado pelo seu fisioterapeuta</p>
      </div>
      <div id="invalido" hidden>
        <p class="aviso">Não encontramos essa orientação.</p>
        <p></p>
        <a class="btn" href="inicio.html">Voltar ao Início</a>
      </div>
    </main>
    <nav class="menu" aria-label="Menu principal">
      <a href="inicio.html"><span class="bolinha" aria-hidden="true"></span>Início</a>
      <a href="tratamentos.html" aria-current="page"><span class="bolinha" aria-hidden="true"></span>Tratamentos</a>
      <a href="registro.html"><span class="bolinha" aria-hidden="true"></span>Evolução</a>
      <a href="perfil.html"><span class="bolinha" aria-hidden="true"></span>Perfil</a>
    </nav>
  </div>
  <script src="../js/orientacao.js"></script>
</body>
</html>
